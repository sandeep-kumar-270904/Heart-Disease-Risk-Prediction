# ==============================================================================
# HeartXAI 2.0 — Local Containerized Development Environment
# ==============================================================================
# Orchestrates local PostgreSQL 16 and Redis 7.2 services for development,
# integration testing, and local synthetic data demonstration.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Relational Store: PostgreSQL 16 (Relational PHI Store / Synthetic DB)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: heartxai-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heartxai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heartxai_password}
      POSTGRES_DB: ${POSTGRES_DB:-heartxai_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heartxai_user} -d ${POSTGRES_DB:-heartxai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - heartxai-network

  # ----------------------------------------------------------------------------
  # Cache & Session Store: Redis 7.2 (Token Blacklisting & Rate Limiting)
  # ----------------------------------------------------------------------------
  cache:
    image: redis:7.2-alpine
    container_name: heartxai-cache
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - heartxai-network

volumes:
  postgres_data:
    name: heartxai_postgres_data
  redis_data:
    name: heartxai_redis_data

networks:
  heartxai-network:
    name: heartxai_network
    driver: bridge
