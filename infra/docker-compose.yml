# ==============================================================================
# HeartXAI 2.0 — Full Staging / VPS Multi-Container Stack (ADR-007 / Round 01)
# Strictly operates with SYNTHETIC_DATA_ONLY=true (DEC-005 Category C prohibited).
# Requires external SECRET_KEY (>=32 chars, non-placeholder) & TLS cert mount.
# ==============================================================================

services:
  proxy:
    image: nginx:1.26-alpine
    container_name: heartxai-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:-./nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    networks:
      - heartxai-network

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: heartxai-frontend
    restart: unless-stopped
    networks:
      - heartxai-network

  backend:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.backend
    container_name: heartxai-backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      DEBUG: "false"
      SYNTHETIC_DATA_ONLY: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-heartxai_user}:${POSTGRES_PASSWORD:-heartxai_password}@db:5432/${POSTGRES_DB:-heartxai_db}
      REDIS_URL: redis://cache:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set to a strong >=32 char secret}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - heartxai-network

  db:
    image: postgres:16-alpine
    container_name: heartxai-staging-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heartxai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heartxai_password}
      POSTGRES_DB: ${POSTGRES_DB:-heartxai_db}
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heartxai_user} -d ${POSTGRES_DB:-heartxai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - heartxai-network

  cache:
    image: redis:7.2-alpine
    container_name: heartxai-staging-cache
    command: ["redis-server", "--appendonly", "yes", "--rename-command", "FLUSHALL", "", "--rename-command", "FLUSHDB", ""]
    volumes:
      - staging_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - heartxai-network

volumes:
  staging_pgdata:
  staging_redisdata:

networks:
  heartxai-network:
    driver: bridge
