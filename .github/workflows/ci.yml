name: HeartXAI 2.0 CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Quality, Linting & Formatting Checks
  # ----------------------------------------------------------------------------
  lint-and-format:
    name: Code Hygiene & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff Linter & Formatter
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9

      - name: Verify Code Formatting
        run: |
          cd backend
          ruff format --check .

      - name: Run Ruff Lint Checks
        run: |
          cd backend
          ruff check .

  # ----------------------------------------------------------------------------
  # Stage 2: Security & Static Analysis (SAST)
  # ----------------------------------------------------------------------------
  security-audit:
    name: Security & SAST Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit SAST Scanner
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]

      - name: Run Bandit Security Analysis
        run: |
          bandit -r backend/app -ll -ii

  # ----------------------------------------------------------------------------
  # Stage 3: Automated Test Suite & Coverage
  # ----------------------------------------------------------------------------
  backend-tests:
    name: Backend Test Suite & Coverage
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    env:
      ENVIRONMENT: test
      DEBUG: "false"
      SYNTHETIC_DATA_ONLY: "true"
      DATABASE_URL: sqlite:///./test_ci.db
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Pytest Suite with Coverage
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=80

  # ----------------------------------------------------------------------------
  # Stage 4: Docker Compose Configuration Validation
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
