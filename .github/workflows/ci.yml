name: HeartXAI 2.0 CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Python Quality, Formatting & Strict Type Checking
  # ----------------------------------------------------------------------------
  lint-and-format:
    name: Python Lint, Format & Strict Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python Runtime & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Verify Code Formatting
        run: ruff format --check backend/ ml/ scripts/

      - name: Run Ruff Lint Checks
        run: ruff check backend/ ml/ scripts/

      - name: Run Strict Mypy Type Checks
        run: |
          cd backend
          mypy --strict app/core app/schemas app/ml app/services app/api/v1/routes app/main.py

  # ----------------------------------------------------------------------------
  # Stage 1b: Frontend Typecheck, Lint, Vitest + a11y & Build
  # ----------------------------------------------------------------------------
  frontend-quality:
    name: Frontend Quality, A11y Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Strict TypeScript Check
        run: |
          cd frontend
          npm run typecheck

      - name: Run ESLint (a11y + TypeScript)
        run: |
          cd frontend
          npm run lint

      - name: Run Vitest & axe-core Accessibility Tests
        run: |
          cd frontend
          npm test

      - name: Verify Production Bundle Build
        run: |
          cd frontend
          npm run build

  # ----------------------------------------------------------------------------
  # Stage 2: Security & Static Analysis (SAST)
  # ----------------------------------------------------------------------------
  security-audit:
    name: Security & SAST Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit SAST Scanner
        run: |
          python -m pip install --upgrade pip
          pip install "bandit[toml]>=1.7.9"

      - name: Run Bandit Security Analysis
        run: bandit -r backend/app -ll -ii

  # ----------------------------------------------------------------------------
  # Stage 3: Automated Test Suite, Postgres 16 Migrations & Coverage
  # ----------------------------------------------------------------------------
  backend-tests:
    name: Backend & ML Test Suite (PostgreSQL 16 & Coverage)
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: heartxai_user
          POSTGRES_PASSWORD: heartxai_password
          POSTGRES_DB: heartxai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DEBUG: "false"
      SYNTHETIC_DATA_ONLY: "true"
      DATABASE_URL: postgresql://heartxai_user:heartxai_password@localhost:5432/heartxai_test
      TEST_DATABASE_URL: postgresql://heartxai_user:heartxai_password@localhost:5432/heartxai_test
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Backend & ML Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Verify Alembic Upgrade / Downgrade / Seed on PostgreSQL 16
        run: |
          cd backend
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          python ../scripts/seed_synthetic_database.py --assessments 10 --seed 42

      - name: Execute Pytest Suite (Backend + ML)
        run: |
          cd backend
          pytest tests/ ../ml/tests/ -v

  # ----------------------------------------------------------------------------
  # Stage 4: Docker Compose Configuration Validation
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Docker Compose Configuration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Local & Infra Docker Compose Configurations
        env:
          SECRET_KEY: ci-validation-non-placeholder-key-at-least-32-chars
        run: |
          docker compose config -q
          docker compose -f infra/docker-compose.yml config -q
