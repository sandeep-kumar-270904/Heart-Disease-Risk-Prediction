name: HeartXAI 2.0 CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Quality, Linting & Formatting Checks
  # ----------------------------------------------------------------------------
  lint-and-format:
    name: Code Hygiene & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff Linter & Formatter
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9

      - name: Verify Code Formatting
        run: |
          cd backend
          ruff format --check . ../scripts/generate_synthetic_patients.py

      - name: Run Ruff Lint Checks
        run: |
          cd backend
          ruff check . ../scripts/generate_synthetic_patients.py

  # ----------------------------------------------------------------------------
  # Stage 1b: Frontend Typecheck, Lint, Vitest + a11y & Build
  # ----------------------------------------------------------------------------
  frontend-quality:
    name: Frontend Quality, A11y Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Strict TypeScript Check
        run: |
          cd frontend
          npm run typecheck

      - name: Run ESLint (a11y + TypeScript)
        run: |
          cd frontend
          npm run lint

      - name: Run Vitest & axe-core Accessibility Tests
        run: |
          cd frontend
          npm test

      - name: Verify Production Bundle Build
        run: |
          cd frontend
          npm run build

  # ----------------------------------------------------------------------------
  # Stage 2: Security & Static Analysis (SAST)
  # ----------------------------------------------------------------------------
  security-audit:
    name: Security & SAST Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit SAST Scanner
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]

      - name: Run Bandit Security Analysis
        run: |
          bandit -r backend/app -ll -ii

  # ----------------------------------------------------------------------------
  # Stage 3: Automated Test Suite, Postgres 16 Migrations & Coverage
  # ----------------------------------------------------------------------------
  backend-tests:
    name: Backend Test Suite (PostgreSQL 16 & Coverage)
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: heartxai_user
          POSTGRES_PASSWORD: heartxai_password
          POSTGRES_DB: heartxai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DEBUG: "false"
      SYNTHETIC_DATA_ONLY: "true"
      DATABASE_URL: postgresql://heartxai_user:heartxai_password@localhost:5432/heartxai_test
      TEST_DATABASE_URL: postgresql://heartxai_user:heartxai_password@localhost:5432/heartxai_test
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Alembic Upgrade / Downgrade / Seed on PostgreSQL 16
        run: |
          cd backend
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          python ../scripts/seed_synthetic_database.py --assessments 10 --seed 42

      - name: Execute Pytest Suite against PostgreSQL 16
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=80

  # ----------------------------------------------------------------------------
  # Stage 4: Docker Compose Configuration Validation
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
